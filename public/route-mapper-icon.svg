<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer circle -->
  <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="2.5" opacity="0.15"/>
  <!-- Globe grid lines -->
  <ellipse cx="32" cy="32" rx="14" ry="30" stroke="currentColor" stroke-width="1.5" opacity="0.12"/>
  <line x1="2" y1="32" x2="62" y2="32" stroke="currentColor" stroke-width="1.5" opacity="0.12"/>
  <!-- Route path -->
  <path d="M16 44 Q20 36 28 34 Q36 32 36 24 Q36 18 44 16" stroke="url(#grad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Start node -->
  <circle cx="16" cy="44" r="4" fill="#3b82f6"/>
  <circle cx="16" cy="44" r="2" fill="white"/>
  <!-- Waypoint -->
  <circle cx="36" cy="24" r="3" fill="#8b5cf6"/>
  <circle cx="36" cy="24" r="1.5" fill="white"/>
  <!-- End node (pin shape) -->
  <circle cx="44" cy="16" r="4.5" fill="#ec4899"/>
  <circle cx="44" cy="16" r="2" fill="white"/>
  <!-- Small dots along the route -->
  <circle cx="23" cy="36" r="1.5" fill="#6366f1" opacity="0.6"/>
  <circle cx="31" cy="30" r="1.5" fill="#6366f1" opacity="0.6"/>
  <defs>
    <linearGradient id="grad" x1="16" y1="44" x2="44" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
</svg>
